name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main  # Adjust if you choose a different branch
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./   # Root of the portfolio repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
